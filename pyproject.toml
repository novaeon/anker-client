[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "anker-client"
dynamic = ["version"]
description = "Unofficial desktop client and download manager for AnkerGames."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "David Mayilyan" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PyQt6>=6.7.0",
    "PyQt6-WebEngine>=6.7.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "keyring>=25.0.0",
    "psutil>=6.0.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
]
build = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
ankerclient = "anker_client.app:main"

[project.gui-scripts]
ankerclient-gui = "anker_client.app:main"

[tool.setuptools.dynamic]
version = { attr = "anker_client.__version__" }

[tool.setuptools.packages.find]
include = ["anker_client*"]

[tool.setuptools.package-data]
anker_client = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: talks to the real ankergames.net (deselected unless ANKER_LIVE_TESTS=1)",
    "gui: needs a Qt application (runs offscreen)",
    "windows: requires Windows-only APIs",
]
filterwarnings = [
    "ignore::DeprecationWarning:sip.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "RUF001", "RUF002", "RUF003", "RUF012",
    "SIM105", "PLW0603", "PLC0415", "RUF100", "UP046", "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B", "E501"]
"anker_client/ui/icons.py" = ["E501"]
"anker_client/ui/theme/manager.py" = ["E501"]
