[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "anker-client"
version = "0.1.0"
description = "Unofficial desktop client frontend for AnkerGames."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "David Mayilyan" },
]
dependencies = [
    "PyQt6>=6.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pywin32>=306; platform_system == 'Windows'",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
ankerclient = "anker_client.main:main"

[tool.setuptools.packages.find]
include = ["anker_client*"]

[tool.setuptools.package-data]
anker_client = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
