name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  QT_QPA_FONTDIR: C:\Windows\Fonts
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
      - name: Check tag matches version
        shell: pwsh
        run: |
          $version = (python -c "import anker_client; print(anker_client.__version__)").Trim()
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "Tag $env:GITHUB_REF_NAME does not match anker_client.__version__ ($version)" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/AnkerClient-$version-setup.exe" `
            "dist/AnkerClient-$version-portable.zip" `
            --title "AnkerClient $version" --generate-notes
