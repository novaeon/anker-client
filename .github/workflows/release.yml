name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: cmd /c build.bat

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\AnkerClient.exe"
          if (!(Test-Path $exe)) {
            throw "Missing $exe"
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) {
            throw "Unexpectedly small EXE size: $size bytes"
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" "dist\AnkerClient.exe" --generate-notes --title "$env:GITHUB_REF_NAME"
