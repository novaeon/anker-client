name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build executable
        run: cmd /c build.bat

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\\AnkerClient.exe"
          if (!(Test-Path $exe)) {
            throw "Missing $exe"
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) {
            throw "Unexpectedly small executable: $size bytes"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AnkerClient-windows
          path: dist/AnkerClient.exe
          if-no-files-found: error
          retention-days: 14
