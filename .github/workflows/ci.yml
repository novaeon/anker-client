name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  QT_QPA_FONTDIR: C:\Windows\Fonts
  QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
  PYTHONUTF8: "1"

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check anker_client tests packaging

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q --junitxml=build/junit.xml
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-py${{ matrix.python-version }}
          path: build/screens
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests -SkipInstaller
      - name: Smoke-test the frozen app
        shell: pwsh
        run: |
          $out = & dist/AnkerClient/AnkerClient.exe --version | Out-String
          if ($LASTEXITCODE -ne 0) { throw "AnkerClient.exe --version failed: $out" }
          Write-Host $out
      - uses: actions/upload-artifact@v4
        with:
          name: AnkerClient-portable
          path: dist/AnkerClient-*-portable.zip
          if-no-files-found: error
          retention-days: 14
